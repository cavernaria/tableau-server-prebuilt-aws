# Overrides layered on top of the official Helm chart's values-single.yaml. The chart itself is not modified.
# Secrets (license key, initial admin password) and registration info are not written here.
# scripts/deploy.sh passes them at run time.

image:
  repository: tableau/tableau-server-2026.3
  # The chart only builds the reference as "repository:tag", so the digest is appended to the tag.
  tag: "tableau_server_image-20263.26.1022.1645@sha256:c2c43356fee712d3e84081247ab773a8747f1b51161c0e9eea07401076789f88"

primary:
  resources:
    requests:
      cpu: "8"
      memory: "64Gi"
    limits:
      cpu: "16"
      memory: "96Gi"

env:
  ACCEPTEULA: "1"
  TABLEAU_USERNAME: "admin"

persistence:
  storageClass: "gp3"
  size: 100Gi
  # Workaround for a chart bug. The template's isMultinode check returns the string "false", and
  # a non-empty string is truthy in Go templates, so the worker StatefulSet is rendered even in the single-node topology.
  # That worker mounts the bootstrap volume unconditionally, so with the values-single.yaml setting
  # bootstrap.enabled: false the API server rejects it (the volumeMounts name is not found).
  # Enable bootstrap and make it a small ReadWriteOnce volume that EBS can provide.
  # The worker has 0 replicas, so only the primary uses this volume.
  bootstrap:
    enabled: true
    storageClass: "gp3"
    accessMode: ReadWriteOnce
    size: 1Gi

service:
  primary:
    type: ClusterIP

ingress:
  enabled: false
