# 公式 Helm チャートの values-multinode.yaml に重ねる上書き。チャート本体は改変しない。
# 構成は初期ノード 1 つとワーカー 2 つ。トポロジは values-multinode.yaml のものをそのまま使う。
# 秘密情報（ライセンスキー、初期管理者パスワード）、登録情報、EFS の ID はここに書かない。
# scripts/deploy.sh が実行時に渡す。

image:
  repository: tableau/tableau-server-2026.3
  # 単一ノード構成と同じプレビルトイメージ。初期ノードとワーカーで同じものを使う。
  # チャートは "repository:tag" の形でしか組み立てないので、ダイジェストはタグの後ろに付ける。
  tag: "tableau_server_image-20263.26.1022.1645@sha256:c2c43356fee712d3e84081247ab773a8747f1b51161c0e9eea07401076789f88"

# 初期ノードは r6i.4xlarge（16 vCPU / 128 GB）のインスタンスに載せる。値は単一ノード構成と同じ。
primary:
  nodeSelector:
    tableau-role: primary
  resources:
    requests:
      cpu: "8"
      memory: "64Gi"
    limits:
      cpu: "16"
      memory: "96Gi"

# ワーカーは r6i.2xlarge（8 vCPU / 64 GB）のインスタンスに 1 つずつ載せる。
# チャートの既定（requests 32Gi、limits 64Gi）はこのインスタンスに収まらないので下げる。
# ワーカーの数は values-multinode.yaml の 2 のままにする。トポロジのノード数と食い違うと、
# 初期ノードの初期化が待ち続ける。
worker:
  nodeSelector:
    tableau-role: worker
  resources:
    requests:
      cpu: "4"
      memory: "32Gi"
    limits:
      cpu: "6"
      memory: "48Gi"
  # チャートには Pod を分散させる既定がないので、ワーカー同士を別のインスタンスに載せる。
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tableau-server
              app.kubernetes.io/component: worker

env:
  ACCEPTEULA: "1"
  TABLEAU_USERNAME: "admin"

persistence:
  # values-multinode.yaml の既定は gp2（in-tree のプロビジョナー）なので、EBS CSI の gp3 に替える。
  storageClass: "gp3"
  size: 100Gi
  # bootstrap ボリュームは EFS。PV はチャートに作らせる（静的な PV）。
  # EFS の ID（pv.csi.volumeHandle）とマウントターゲットの IP（pv.csi.volumeAttributes.mounttargetip）は、
  # scripts/deploy.sh が Terraform の出力から渡す。
  bootstrap:
    createPV: true

service:
  primary:
    type: ClusterIP

ingress:
  enabled: false

# ワーカーのトポロジを自動で適用するフックは使わない（可変タグの bitnami/kubectl:latest を引くため）。
hooks:
  autoApplyWorkerTopology:
    enabled: false
