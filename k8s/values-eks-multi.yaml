# Overrides layered on top of the official Helm chart's values-multinode.yaml. The chart itself is not modified.
# The topology is one initial node and two workers, taken as is from values-multinode.yaml.
# Secrets (license key, initial admin password), registration info, and the EFS ID are not written here.
# scripts/deploy.sh passes them at run time.

image:
  repository: tableau/tableau-server-2026.3
  # The same prebuilt image as the single-node topology. The initial node and the workers use the same image.
  # The chart only builds the reference as "repository:tag", so the digest is appended to the tag.
  tag: "tableau_server_image-20263.26.1022.1645@sha256:c2c43356fee712d3e84081247ab773a8747f1b51161c0e9eea07401076789f88"

# The initial node runs on an r6i.4xlarge instance (16 vCPU / 128 GB). The values are the same as the single-node topology.
primary:
  nodeSelector:
    tableau-role: primary
  resources:
    requests:
      cpu: "8"
      memory: "64Gi"
    limits:
      cpu: "16"
      memory: "96Gi"

# Each worker runs on its own r6i.2xlarge instance (8 vCPU / 64 GB).
# The chart defaults (requests 32Gi, limits 64Gi) do not fit on this instance, so they are lowered.
# The worker count stays at 2 as in values-multinode.yaml. If it differs from the node count in the topology,
# the initial node's initialization waits forever.
worker:
  nodeSelector:
    tableau-role: worker
  resources:
    requests:
      cpu: "4"
      memory: "32Gi"
    limits:
      cpu: "6"
      memory: "48Gi"
  # The chart has no default that spreads Pods, so the workers are placed on separate instances.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tableau-server
              app.kubernetes.io/component: worker

env:
  ACCEPTEULA: "1"
  TABLEAU_USERNAME: "admin"

persistence:
  # The default in values-multinode.yaml is gp2 (the in-tree provisioner), so it is replaced with gp3 on EBS CSI.
  storageClass: "gp3"
  size: 100Gi
  # The bootstrap volume is EFS. The chart creates the PV (a static PV).
  # The EFS ID (pv.csi.volumeHandle) and the mount target IP (pv.csi.volumeAttributes.mounttargetip)
  # are passed by scripts/deploy.sh from the Terraform outputs.
  bootstrap:
    createPV: true

service:
  primary:
    type: ClusterIP

ingress:
  enabled: false

# The hook that applies the worker topology automatically is not used (it pulls the mutable tag bitnami/kubectl:latest).
hooks:
  autoApplyWorkerTopology:
    enabled: false
